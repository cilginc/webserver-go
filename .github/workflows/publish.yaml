name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.1"

      - uses: ko-build/setup-ko@v0.8

      - name: Build and publish with ko
        run: ko publish ./cmd/server --tags "${TAG_NAME},latest" --base-import-paths --platform=all
        env:
          TAG_NAME: ${{ github.ref_name }}
          KO_DOCKER_REPO: ghcr.io/cilginc
